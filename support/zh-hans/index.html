<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habtic 支持</title><link rel="stylesheet" href="../../styles.css"></head><body><main><div class="mark">H</div><h1>支持</h1><p>如有应用故障、反馈、隐私问题或功能建议，请发送邮件至 <a href="mailto:rancis.contact@rancisstudio.com">rancis.contact@rancisstudio.com</a>。</p><h2>建议提供的信息</h2><p>请注明 iPhone 型号、iOS 版本、应用版本、使用语言以及问题发生步骤。请勿发送私密完成照片或敏感个人信息。</p><h2>本地数据</h2><p>Habtic 不使用账号或云同步。你可以在“Profile → 隐私与数据”中清除全部本地数据。</p><footer><a href="../../privacy/zh-hans/">隐私政策</a> · <a href="../../">语言</a></footer></main></body></html>
