<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habtic 支援</title><link rel="stylesheet" href="../../styles.css"></head><body><main><div class="mark">H</div><h1>支援</h1><p>如有應用程式故障、意見、隱私問題或功能建議，請傳送電子郵件至 <a href="mailto:rancis.contact@rancisstudio.com">rancis.contact@rancisstudio.com</a>。</p><h2>建議提供的資訊</h2><p>請註明 iPhone 型號、iOS 版本、應用程式版本、使用語言以及問題發生步驟。請勿傳送私密完成照片或敏感個人資訊。</p><h2>本機資料</h2><p>Habtic 不使用帳號或雲端同步。你可以在「Profile → 隱私與資料」中清除全部本機資料。</p><footer><a href="../../privacy/zh-hant/">隱私權政策</a> · <a href="../../">語言</a></footer></main></body></html>
